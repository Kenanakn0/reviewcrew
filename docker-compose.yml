# ReviewCrew: API (webhooks) + worker (reviews) + Redis (queue).
#
#   cp .env.example .env   # fill in GitHub App and LLM settings
#   docker compose up --build
#
# GITHUB_PRIVATE_KEY_PATH in .env is the key's path on *this* machine; it is mounted into
# the containers as a secret and the services read it from /run/secrets/github_app_key.

x-reviewcrew: &reviewcrew
  build: .
  image: reviewcrew:latest
  env_file: .env
  environment:
    APP_ENV: production
    REDIS_URL: redis://redis:6379/0
    GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_app_key
    # Inside a container "localhost" is the container itself. A local LLM (Ollama) on the
    # host is reached through host.docker.internal; set OPENAI_COMPAT_BASE_URL_DOCKER in
    # .env for that, otherwise the host value is used unchanged.
    OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL_DOCKER:-${OPENAI_COMPAT_BASE_URL:-}}
  extra_hosts:
    - "host.docker.internal:host-gateway"  # Docker Desktop provides it; Linux needs this
  secrets:
    - github_app_key
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *reviewcrew
    ports:
      # Loopback only: webhooks arrive through a local forwarder (smee) or a reverse proxy.
      - "127.0.0.1:${PORT:-8000}:8000"

  worker:
    <<: *reviewcrew
    command: ["reviewcrew-worker"]
    healthcheck:
      disable: true  # no HTTP server; arq logs its own health

  redis:
    # No `ports:` on purpose: Redis has no auth here and is reachable only by app and worker
    # on the Compose network, never from the host or the outside.
    image: redis:8.10-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

secrets:
  github_app_key:
    file: ${GITHUB_PRIVATE_KEY_PATH:?set GITHUB_PRIVATE_KEY_PATH in .env}

volumes:
  redis-data:
